[project]
name = "allo-shared"
version = "0.1.0"
description = "Алло — Shared Library"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
